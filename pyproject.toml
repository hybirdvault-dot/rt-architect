[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtarchitect"
version = "0.1.0"
description = "Deterministic-first QNX IPC architectural analysis tool"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "networkx>=3",
    "typer>=0.9",
    "rich>=13",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
ai = ["openai>=1.0"]

[project.scripts]
rtarch = "rtarch.cli:app"

[tool.setuptools.packages.find]
include = ["rtarch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
